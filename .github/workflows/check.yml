name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22.19.0', '24']
        sdk: ['0.2.0-rc.2', '0.2.1-alpha.1']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Validate public dependency sources
        run: node scripts/check-lockfile.mjs
      - run: npm ci
      - name: Select alpha SDK for regression
        if: matrix.sdk == '0.2.1-alpha.1'
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs'
          const manifest = JSON.parse(fs.readFileSync('package.json', 'utf8'))
          for (const name of Object.keys(manifest.devDependencies)) {
            if (name.startsWith('@deepseek-ai/dsh-')) manifest.devDependencies[name] = '0.2.1-alpha.1'
          }
          manifest.devDependencies['@deepseek-ai/cordis'] = '4.0.5-alpha.1'
          manifest.devDependencies['@deepseek-ai/schemastery'] = '3.18.5-alpha.1'
          fs.writeFileSync('package.json', JSON.stringify(manifest, null, 2) + '\n')
          JS
          rm -rf node_modules package-lock.json
          npm install --ignore-scripts
      - run: npm run check
      - run: npm pack --dry-run
